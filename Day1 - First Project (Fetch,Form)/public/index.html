<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Students</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --glass: rgba(255, 255, 255, 0.08);
      --glass-strong: rgba(255, 255, 255, 0.14);
      --border: rgba(255, 255, 255, 0.18);
      --text: #f5f6fb;
      --muted: rgba(245, 246, 251, 0.62);
      --accent: #8b5cf6;
      --accent-2: #22d3ee;
      --danger: #fb7185;
      --success: #34d399;
      --radius: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: var(--text);
      background: #0b0b1a;
      display: grid;
      place-items: center;
      padding: 40px 16px;
      overflow-x: hidden;
    }

    /* ---------- Animated background blobs ---------- */
    .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.75;
      animation: float 18s ease-in-out infinite alternate;
    }
    .blob.one   { width: 420px; height: 420px; background: #7c3aed; top: -100px; left: -80px; }
    .blob.two   { width: 360px; height: 360px; background: #06b6d4; bottom: -80px; right: -60px; animation-delay: -6s; }
    .blob.three { width: 300px; height: 300px; background: #ec4899; top: 40%; left: 55%; animation-delay: -12s; }
    @keyframes float {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(60px, -40px) scale(1.1); }
      100% { transform: translate(-40px, 50px) scale(0.95); }
    }
    .bg::after { /* subtle grain */
      content: ""; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 3px 3px;
    }

    /* ---------- Layout ---------- */
    .wrap {
      width: 100%;
      max-width: 980px;
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 24px;
    }
    @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }

    .glass {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      padding: 32px;
      position: relative;
      overflow: hidden;
    }
    .glass::before { /* light sheen */
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent 40%);
    }

    h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; }
    h2 { font-size: 1.25rem; font-weight: 600; }
    .sub { color: var(--muted); font-size: 0.92rem; margin: 6px 0 26px; }

    /* ---------- Form ---------- */
    .field { position: relative; margin-bottom: 18px; }
    .field input {
      width: 100%;
      padding: 22px 46px 10px 16px;
      font: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      transition: border-color .2s, background .2s, box-shadow .2s;
    }
    .field label {
      position: absolute; left: 16px; top: 16px;
      color: var(--muted); font-size: 0.95rem;
      pointer-events: none;
      transition: all .2s ease;
    }
    .field input:focus,
    .field input:not(:placeholder-shown) { background: rgba(255,255,255,0.1); }
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.25);
    }
    .field input:focus + label,
    .field input:not(:placeholder-shown) + label {
      top: 7px; font-size: 0.72rem; color: var(--accent-2); letter-spacing: .03em;
    }
    .toggle-pass {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 0.8rem; padding: 6px;
    }
    .toggle-pass:hover { color: var(--text); }

    .btn {
      width: 100%;
      padding: 14px;
      font: inherit; font-weight: 600; font-size: 1rem;
      color: #fff;
      border: none; border-radius: 14px; cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
      transition: transform .15s, box-shadow .2s, opacity .2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(139, 92, 246, 0.5); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: .6; cursor: progress; }
    .btn.ghost {
      background: var(--glass-strong); box-shadow: none; margin-top: 10px;
      border: 1px solid var(--border);
    }

    .msg {
      min-height: 22px; margin-top: 14px; font-size: 0.88rem; text-align: center;
    }
    .msg.ok  { color: var(--success); }
    .msg.err { color: var(--danger); }

    /* ---------- Student list ---------- */
    .list-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .count {
      font-size: .8rem; padding: 4px 12px; border-radius: 999px;
      background: var(--glass-strong); border: 1px solid var(--border);
    }
    .students { list-style: none; display: grid; gap: 12px; max-height: 470px; overflow-y: auto; padding-right: 4px; }
    .students::-webkit-scrollbar { width: 6px; }
    .students::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

    .student {
      display: flex; align-items: center; gap: 14px;
      padding: 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: background .2s, transform .2s;
      animation: pop .3s ease;
    }
    .student:hover { background: rgba(255, 255, 255, 0.1); transform: translateX(3px); }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .avatar {
      flex: none; width: 44px; height: 44px; border-radius: 14px;
      display: grid; place-items: center; font-weight: 700;
      background: linear-gradient(135deg, rgba(139,92,246,.8), rgba(34,211,238,.8));
    }
    .info { flex: 1; min-width: 0; }
    .info strong { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info span { color: var(--muted); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

    .actions { display: flex; gap: 6px; }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--glass);
      color: var(--text); cursor: pointer; font-size: .9rem;
      transition: background .2s, color .2s;
    }
    .icon-btn:hover { background: var(--glass-strong); }
    .icon-btn.del:hover { color: var(--danger); border-color: var(--danger); }

    .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: .92rem; }
  </style>
</head>
<body>
  <div class="bg">
    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="blob three"></div>
  </div>

  <main class="wrap">
    <!-- Form card -->
    <section class="glass">
      <h1 id="formTitle">Add student</h1>
      <p class="sub" id="formSub">Fill in the details to add a new student.</p>

      <!-- Plain HTML form submit (no fetch). Server redirects back to "/?type=..&msg=.." -->
      <form id="studentForm" action="/api/students" method="POST">
        <input type="hidden" id="studentId" />

        <div class="field">
          <input type="text" id="name" name="name" placeholder=" " required autocomplete="name" />
          <label for="name">Full name</label>
        </div>

        <div class="field">
          <input type="email" id="email" name="email" placeholder=" " required autocomplete="email" />
          <label for="email">Email address</label>
        </div>

        <div class="field">
          <input type="password" id="password" name="password" placeholder=" " required minlength="6" autocomplete="new-password" />
          <label for="password">Password</label>
          <button type="button" class="toggle-pass" id="togglePass">Show</button>
        </div>

        <button type="submit" class="btn" id="submitBtn">Add student</button>
        <button type="button" class="btn ghost" id="cancelBtn" hidden>Cancel edit</button>
        <p class="msg" id="msg"></p>
      </form>
    </section>

    <!-- List card -->
    <section class="glass">
      <div class="list-head">
        <h2>Students</h2>
        <span class="count" id="count">0</span>
      </div>
      <ul class="students" id="students">
        <li class="empty">Loading…</li>
      </ul>
    </section>
  </main>

  <script>
    // List  -> fetch("/api/students")            (fetch all)
    // Create/Edit -> normal <form action> POST (no fetch, page reloads)
    // Delete -> fetch DELETE                   (HTML forms can't send DELETE)
    const $ = (id) => document.getElementById(id);
    const form = $("studentForm");
    const msg = $("msg");
    const list = $("students");

    let students = [];

    const showMsg = (text, type = "ok") => {
      msg.textContent = text;
      msg.className = `msg ${type}`;
    };

    const escapeHtml = (s) =>
      String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function renderStudents() {
      $("count").textContent = students.length;
      list.innerHTML = students.length
        ? students.map((u) => `
            <li class="student">
              <div class="avatar">${escapeHtml(u.name.charAt(0).toUpperCase())}</div>
              <div class="info">
                <strong>${escapeHtml(u.name)}</strong>
                <span>${escapeHtml(u.email)}</span>
              </div>
              <div class="actions">
                <button class="icon-btn" title="Edit" data-edit="${escapeHtml(u._id)}">✎</button>
                <button class="icon-btn del" title="Delete" data-del="${escapeHtml(u._id)}">✕</button>
              </div>
            </li>`).join("")
        : `<li class="empty">No students yet — add the first one ✨</li>`;
    }

    // ---------- Fetch all students ----------
    async function fetchStudents() {
      try {
        const res = await fetch("/api/students");
        const json = await res.json();
        if (!res.ok) throw new Error(json.message || "Failed to load students");
        students = json.data;
        renderStudents();
      } catch (err) {
        list.innerHTML = `<li class="empty">${escapeHtml(err.message)}</li>`;
      }
    }

    // ---------- Edit mode: just point the form action at /api/students/:id ----------
    function setEditMode(student) {
      const editing = Boolean(student);
      form.action = editing ? `/api/students/${encodeURIComponent(student._id)}` : "/api/students";
      $("studentId").value = editing ? student._id : "";
      $("name").value = editing ? student.name : "";
      $("email").value = editing ? student.email : "";
      $("password").value = "";
      $("password").required = !editing; // password optional when editing
      $("formTitle").textContent = editing ? "Edit student" : "Add student";
      $("formSub").textContent = editing
        ? "Update the details. Leave password empty to keep it."
        : "Fill in the details to add a new student.";
      $("submitBtn").textContent = editing ? "Save changes" : "Add student";
      $("cancelBtn").hidden = !editing;
      showMsg("");
    }

    // No preventDefault — the browser submits the form itself. Only disable the button.
    form.addEventListener("submit", () => {
      $("submitBtn").disabled = true;
    });

    list.addEventListener("click", async (e) => {
      const editBtn = e.target.closest("[data-edit]");
      const delBtn = e.target.closest("[data-del]");

      if (editBtn) {
        setEditMode(students.find((u) => u._id === editBtn.dataset.edit));
        $("name").focus();
      }
      if (delBtn && confirm("Delete this student?")) {
        const id = delBtn.dataset.del;
        const res = await fetch(`/api/students/${encodeURIComponent(id)}`, { method: "DELETE" });
        const json = await res.json();
        showMsg(json.message, res.ok ? "ok" : "err");
        if ($("studentId").value === id) setEditMode(null);
        fetchStudents();
      }
    });

    $("cancelBtn").addEventListener("click", () => setEditMode(null));

    $("togglePass").addEventListener("click", (e) => {
      const input = $("password");
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      e.target.textContent = show ? "Hide" : "Show";
    });

    // Message from the server redirect after a form submit: /?type=ok&msg=...
    const params = new URLSearchParams(location.search);
    if (params.has("msg")) {
      showMsg(params.get("msg"), params.get("type") === "err" ? "err" : "ok");
      history.replaceState(null, "", "/"); // clean the URL
    }

    fetchStudents();
  </script>
</body>
</html>
